# ==========================================================================
# Netlify configuration
# --------------------------------------------------------------------------
# Eleventy turns the templates in src/ into plain HTML in _site/, and Netlify
# uploads that folder and deploys the contact function.
#
# In Netlify: "Add new site" -> "Import an existing project" -> pick this
# repo -> accept the defaults. Netlify reads everything it needs from here.
# ==========================================================================

[build]
  # Eleventy writes the finished site here. Never edit _site/ by hand:
  # it is thrown away and rebuilt on every deploy. Edit src/ instead.
  publish = "_site"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# --------------------------------------------------------------------------
# Local preview WITH the contact function: `npm run netlify`
#
# This starts the Eleventy preview server and puts the Netlify CLI in front
# of it, so /.netlify/functions/contact answers the same way it will in
# production. Plain `npm run dev` does not serve functions, which is why the
# Discord ping 404s there. That 404 is harmless — the message still reaches
# Formspark — but you cannot test Discord without this.
# --------------------------------------------------------------------------
[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 4173
  port = 8888
  publish = "_site"
  autoLaunch = false

# --------------------------------------------------------------------------
# Friendly URLs: /about also serves /about.html
# (Netlify does this automatically, these entries just make it explicit.)
# --------------------------------------------------------------------------
[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 301

# --------------------------------------------------------------------------
# Security + caching headers
# --------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Images and fonts rarely change, so let browsers keep them for a year.
[[headers]]
  for = "/assets/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
