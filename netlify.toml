# ==========================================================================
# Netlify configuration
# --------------------------------------------------------------------------
# This is a plain static site, so there is nothing to compile. Netlify just
# uploads the files in this folder and deploys the contact function.
#
# In Netlify: "Add new site" -> "Import an existing project" -> pick this
# repo -> accept the defaults. Netlify reads everything it needs from here.
# ==========================================================================

[build]
  # The site lives at the repository root.
  publish = "."
  # No build step. Netlify still runs `npm install` because package.json
  # exists, which is what makes nodemailer available to the function.
  command = "echo 'Static site - nothing to build.'"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# --------------------------------------------------------------------------
# Friendly URLs: /about also serves /about.html
# (Netlify does this automatically, these entries just make it explicit.)
# --------------------------------------------------------------------------
[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 301

# --------------------------------------------------------------------------
# Security + caching headers
# --------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Images and fonts rarely change, so let browsers keep them for a year.
[[headers]]
  for = "/assets/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
